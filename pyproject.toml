[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gravion-trainner"
version = "0.1.0"
description = "Gravion Trainner: model evaluation and quality improvement starter"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = []

[project.scripts]
gravion-trainner = "gravion_trainner.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
